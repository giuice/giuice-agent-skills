<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spec Interview — Round 2 · Skill de Clarificação de Domínios</title>
<style>
  :root {
    --bg: #0f1115; --card: #181b22; --card-2: #1f232c; --border: #2b303b;
    --text: #e6e9ef; --muted: #9aa3b2; --accent: #6ea8fe; --accent-soft: #2a3b57; --ok: #3ddc97;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 32px 20px 120px; }
  header h1 { font-size: 1.5rem; margin: 0 0 6px; }
  header p { color: var(--muted); margin: 0 0 8px; }
  .hint { background: var(--accent-soft); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 16px; font-size: .92rem; margin: 18px 0 28px; }
  fieldset { border: 1px solid var(--border); border-radius: 12px; background: var(--card);
    margin: 0 0 20px; padding: 18px 20px; }
  legend { font-weight: 600; padding: 0 8px; font-size: 1.02rem; }
  .domain { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); margin: -4px 0 12px; }
  .opt { display: flex; gap: 10px; align-items: flex-start; padding: 9px 11px;
    border: 1px solid transparent; border-radius: 8px; cursor: pointer; transition: background .12s, border-color .12s; }
  .opt:hover { background: var(--card-2); }
  .opt:focus-within { border-color: var(--accent); }
  .opt input { margin-top: 4px; accent-color: var(--accent); width: 16px; height: 16px; flex: none; }
  .rec { color: var(--ok); font-size: .78rem; font-weight: 600; margin-left: 6px; }
  .reason { color: var(--muted); }
  textarea { width: 100%; margin-top: 12px; background: var(--card-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; font: inherit; resize: vertical; min-height: 44px; }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .note-label { font-size: .8rem; color: var(--muted); display: block; margin-top: 12px; }
  .bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(15,17,21,.92);
    backdrop-filter: blur(6px); border-top: 1px solid var(--border); padding: 14px 20px;
    display: flex; gap: 12px; justify-content: center; align-items: center; }
  button { font: inherit; font-weight: 600; cursor: pointer; border-radius: 9px; padding: 11px 20px; border: 1px solid var(--border); }
  .primary { background: var(--accent); color: #0b1020; border-color: var(--accent); }
  .primary:hover { filter: brightness(1.08); }
  .ghost { background: transparent; color: var(--text); }
  .ghost:hover { background: var(--card-2); }
  #status { color: var(--ok); font-size: .9rem; min-height: 1.2em; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Spec Interview — Round 2</h1>
    <p>Skill nova: <strong>Clarificação de Domínios</strong> · fechando lacunas da Round 1</p>
  </header>
  <div class="hint">
    Só as áreas que ficaram em aberto. Várias perguntas são <strong>múltipla escolha</strong>.
    Use o campo <strong>Outra / nota</strong> sempre que quiser. No fim, <strong>Copiar respostas</strong> e cole no chat.
  </div>
  <form id="form"></form>
  <div class="bar">
    <button type="button" class="primary" onclick="copyAnswers()">Copiar respostas</button>
    <button type="button" class="ghost" onclick="downloadAnswers()">Baixar answers.json</button>
    <span id="status" role="status" aria-live="polite"></span>
  </div>
</div>
<script>
const QUESTIONS = [
  { id: "q1", domain: "Requisitos · estrutura do Mapa de Domínios", multi: true,
    title: "O que cada domínio no Mapa deve conter? (marque todos)",
    options: [
      ["A", "Nome + descrição curta do domínio", true, "identificação"],
      ["B", "Ambiguidades e perguntas em aberto", true, "o que falta clarificar"],
      ["C", "Definições resolvidas (termos clarificados)", true, "saída de valor"],
      ["D", "Status/confiança (claro / parcial / aberto)", true, "rastreio de cobertura"],
    ] },
  { id: "q2", domain: "Requisitos · mecânica de confirmação (← q5)", multi: false,
    title: "Como o usuário confirma/corrige os domínios inferidos?",
    options: [
      ["A", "IA lista os domínios inferidos; usuário marca quais valem, remove e adiciona", true, "confirmação ativa"],
      ["B", "IA assume e segue; usuário corrige só se quiser", false, "menos atrito"],
      ["C", "Usuário escreve os domínios livremente", false, "sem inferência"],
    ] },
  { id: "q3", domain: "Casos extremos (← q8)", multi: true,
    title: "Além de 'pedido vago', quais situações a skill deve tratar? (marque todas)",
    options: [
      ["A", "Muitos domínios de uma vez → priorizar/agrupar", true, "evita sobrecarga"],
      ["B", "Domínios conflitantes / termos com sentidos opostos", true, "conflito semântico"],
      ["C", "Usuário não sabe responder → marca como aberto/deferido", true, "não trava"],
      ["D", "Pedido já claro → encerra rápido sem perguntas desnecessárias", true, "eficiência"],
    ] },
  { id: "q4", domain: "Regra de negócio · priorização", multi: false,
    title: "Quando há domínios demais, como a skill se comporta?",
    options: [
      ["A", "Prioriza os que bloqueiam a spec; o resto vira 'aberto'", true, "foco no que importa"],
      ["B", "Sem limite — clarifica todos", false, "completo, porém longo"],
      ["C", "Teto fixo (ex.: top 5 domínios)", false, "limite rígido"],
    ] },
  { id: "q5", domain: "Goals · métricas de sucesso", multi: true,
    title: "Como saber que a skill funcionou? (marque todas)",
    options: [
      ["A", "Redução de suposições/ambiguidades antes da spec", true, "objetivo central"],
      ["B", "Usuário confirma o mapa em poucas rodadas", true, "eficiência"],
      ["C", "Menos retrabalho na spec depois", false, "impacto downstream"],
      ["D", "Todo domínio relevante apareceu (cobertura)", true, "completude"],
    ] },
  { id: "q6", domain: "Usuários · secundários/stakeholders", multi: true,
    title: "Quem mais usa ou depende da saída? (marque todos)",
    options: [
      ["A", "Quem vai escrever a spec/plano depois", true, "consumidor do mapa"],
      ["B", "Especialistas de domínio que validam o mapa", false, "revisão"],
      ["C", "Não há usuários secundários", false, "uso individual"],
    ] },
  { id: "q7", domain: "Estratégia de testes (← q11)", multi: false,
    title: "Que forma os evals da skill tomam?",
    options: [
      ["A", "Conjunto de pedidos-exemplo com mapa de domínios esperado (golden set)", true, "comparável e repetível"],
      ["B", "Checklist qualitativo a cada execução", false, "leve, subjetivo"],
      ["C", "Ambos", false, "golden + checklist"],
    ] },
  { id: "q8", domain: "Critério de aceite · fluxo principal", multi: false,
    title: "Confirme o fluxo principal (Given/When/Then):",
    options: [
      ["A", "Dado um pedido vago, quando rodar a skill, então ela infere domínios, faz perguntas em rodadas e só encerra com a confirmação do mapa pelo usuário", true, "fluxo canônico"],
      ["B", "Diferente — descrevo na nota", false, "ajustar"],
    ] },
  { id: "q9", domain: "Escopo · must-have do v1", multi: true,
    title: "O que é obrigatório na primeira versão? (marque todos)",
    options: [
      ["A", "Inferência de domínios + confirmação do usuário", true, "núcleo"],
      ["B", "Entrega por rodadas (UI nativa / HTML fallback)", true, "interação"],
      ["C", "Mapa de Domínios salvo em arquivo", true, "entregável"],
      ["D", "Persistência de estado entre rodadas", false, "resiliência"],
      ["E", "Evals/golden set já no v1", false, "qualidade desde o início"],
    ] },
];

const form = document.getElementById("form");
QUESTIONS.forEach((q, i) => {
  const fs = document.createElement("fieldset");
  const type = q.multi ? "checkbox" : "radio";
  let html = `<legend>${i + 1}. ${q.title}</legend>`;
  html += `<div class="domain">${q.domain}${q.multi ? " · múltipla escolha" : ""}</div>`;
  q.options.forEach(([key, label, rec, reason]) => {
    html += `<label class="opt"><input type="${type}" name="${q.id}" value="${key}">
      <span><b>${key}.</b> ${label}${rec ? '<span class="rec">(Recomendada)</span>' : ''}
      ${reason ? ` — <span class="reason">${reason}</span>` : ''}</span></label>`;
  });
  html += `<label class="note-label" for="${q.id}-note">Outra / nota (sua resposta livre):</label>
    <textarea id="${q.id}-note" placeholder="Escreva aqui se nenhuma opção encaixa, ou para complementar..."></textarea>`;
  fs.innerHTML = html;
  form.appendChild(fs);
});

function collect() {
  return { round: 2, topic: "skill-clarificacao-de-dominios",
    answers: QUESTIONS.map(q => ({
      id: q.id,
      selected: [...document.querySelectorAll(`input[name="${q.id}"]:checked`)].map(el => el.value),
      note: document.getElementById(`${q.id}-note`).value.trim()
    })) };
}
function copyAnswers() {
  const data = JSON.stringify(collect(), null, 2);
  navigator.clipboard.writeText(data).then(() => setStatus("✓ Copiado! Cole o bloco no chat."), () => fallbackCopy(data));
}
function fallbackCopy(text) {
  const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); setStatus("✓ Copiado! Cole o bloco no chat."); }
  catch (e) { setStatus("Não consegui copiar — use 'Baixar answers.json'."); }
  document.body.removeChild(ta);
}
function downloadAnswers() {
  const blob = new Blob([JSON.stringify(collect(), null, 2)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = "answers-round-2.json"; a.click(); URL.revokeObjectURL(a.href);
  setStatus("✓ Baixado answers-round-2.json");
}
function setStatus(msg) { document.getElementById("status").textContent = msg; }
</script>
</body>
</html>
